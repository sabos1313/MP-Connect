<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var base = '/MP-Connect';
        var path = window.location.pathname.indexOf(base) === 0 ? window.location.pathname.slice(base.length) : window.location.pathname;
        var query = path + window.location.search + window.location.hash;
        window.location.replace(base + '/?/' + query.replace(/^\//, ''));
      }());
    </script>
  </head>
  <body></body>
</html>
